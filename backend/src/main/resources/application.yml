spring:
  application:
    name: pulse-api
  datasource:
    url: ${PULSE_DB_URL:jdbc:postgresql://localhost:5432/pulse}
    username: ${PULSE_DB_USER:pulse}
    password: ${PULSE_DB_PASSWORD:pulse}
    hikari:
      maximum-pool-size: ${PULSE_DB_POOL:10}
  data:
    redis:
      host: ${PULSE_REDIS_HOST:localhost}
      port: ${PULSE_REDIS_PORT:6379}
      timeout: 2s
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

pulse:
  jwt:
    # Must be at least 32 bytes. Override with PULSE_JWT_SECRET outside local development.
    secret: ${PULSE_JWT_SECRET:local-dev-only-secret-change-me-0123456789}
    ttl: ${PULSE_JWT_TTL:PT24H}
  outbox:
    relay:
      enabled: ${PULSE_OUTBOX_RELAY_ENABLED:true}
      interval-ms: 500
  timeline:
    # Entries kept per home timeline in Redis.
    capacity: 800
    # Authors with at least this many followers are merged at read time instead of fanned out.
    fanout-threshold: 5000
    # Recent posts copied into a timeline when the user follows someone.
    follow-backfill: 50
    # Timelines of users who stop reading expire and are rebuilt from PostgreSQL on return.
    idle-ttl: P7D
  recommendation:
    candidate-window: P3D
    trending-window: P1D
    seen-window: P7D
    affinity-window: P30D
    source-limit: 200
    snapshot-size: 200
    snapshot-ttl: PT30M
    recency-half-life-hours: 6
    # Each extra post from the same author in a page multiplies its score by this.
    author-penalty: 0.5
    # Cap on out-of-network posts while in-network candidates remain.
    max-out-of-network-share: 0.5
    weights:
      in-network: 1.0
      author-affinity: 2.0
      social-proof: 1.2
      engagement-velocity: 1.5
      recency: 1.0
      author-reputation: 0.3
      content-affinity: 0.8

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
