spring:
  datasource:
    url: jdbc:h2:mem:pulse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

pulse:
  jwt:
    secret: test-secret-test-secret-test-secret-0123
  outbox:
    relay:
      enabled: false # tests drain the outbox explicitly
  ratelimit:
    enabled: false # RateLimitTest turns it on with tiny limits
  timeline:
    fanout-threshold: 3
  discovery:
    trends-cache-ttl: PT0S
