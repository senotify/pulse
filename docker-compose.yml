# Local development: PostgreSQL only for now. Redis joins with the timeline module.
#   docker compose up -d            # database
#   docker compose --profile api up # database + API on :8080
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulse
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: pulse
    ports:
      - "5432:5432"
    volumes:
      - pulse-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 5s
      retries: 10

  api:
    profiles: ["api"]
    build: ./backend
    environment:
      PULSE_DB_URL: jdbc:postgresql://postgres:5432/pulse
      PULSE_DB_USER: pulse
      PULSE_DB_PASSWORD: pulse
    ports:
      - "${PULSE_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pulse-pg:
